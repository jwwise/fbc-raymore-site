name: Deploy to GitHub Pages

# Builds the Eleventy site and publishes it to GitHub Pages. A content change
# committed through the GitHub web UI is enough to trigger a full redeploy, so
# updating service times or staff needs no local toolchain.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it, so Pages is never
# left serving a half-published build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Must run before the build: it reports where Pages will actually serve
      # this site, which the build needs in order to write correct URLs.
      - id: pages
        uses: actions/configure-pages@v5

      # While this is a project site the origin is <owner>.github.io and the
      # prefix is /fbc-raymore-site/. Once the custom domain is set in
      # Settings -> Pages, configure-pages reports www.faithbaptistraymore.org
      # with a prefix of /, and the same build becomes the production site --
      # including dropping the preview noindex. No code change at cutover.
      - run: npm run build
        env:
          BASE_ORIGIN: ${{ steps.pages.outputs.origin }}
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
